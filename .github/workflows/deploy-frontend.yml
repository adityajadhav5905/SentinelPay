name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Verify Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  deploy:
    name: Deploy Frontend to EC2
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Deployment Credentials
        id: check_credentials
        env:
          EC2_HOST: ${{ secrets.FRONTEND_EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_USER" ] && [ -n "$EC2_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets detected. Proceeding with EC2 deployment."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment Skipped::EC2 deployment secrets (FRONTEND_EC2_HOST, EC2_USER, EC2_SSH_KEY) are not configured. Deployment step skipped."
          fi

      - name: Deploy via SSH
        if: steps.check_credentials.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FRONTEND_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/SentinelPay/frontend

            # Pull latest code
            git pull origin main

            # Install deps and rebuild
            npm install

            VITE_CLERK_PUBLISHABLE_KEY=pk_test_c2FjcmVkLXN1bmZpc2gtMTQuY2xlcmsuYWNjb3VudHMuZGV2JA \
            VITE_API_URL_AUTH=https://backend.sentinelpay.me \
            VITE_API_URL_ANALYTICS=https://backend.sentinelpay.me \
            VITE_API_URL_INGESTION=https://backend.sentinelpay.me \
            VITE_API_URL_NOTIFICATION=https://backend.sentinelpay.me \
            VITE_API_URL_SUBSCRIPTION=https://backend.sentinelpay.me \
            VITE_API_URL_ML=https://backend.sentinelpay.me \
            npm run build

            # Restart Nginx to serve new build
            sudo systemctl restart nginx

            echo "✅ Frontend deployed!"
