events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Backend upstream definitions
    upstream admin_service { server admin-service:3000; }
    upstream analytics_service { server analytics-service:3001; }
    upstream auth_service { server auth-service:3002; }
    upstream ingestion_service { server ingestion-service:3003; }
    upstream notification_service { server notification-service:3004; }
    upstream subscription_service { server subscription-service:3005; }
    # ML API is currently standalone, but if we route it:
    upstream ml_api { server ml-api:8000; }

    server {
        listen 80;
        server_name localhost; # Will be overridden by domain in PROD with Certbot

        # Reverse Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth Service
        location /api/auth/ {
            rewrite ^/api/auth/(.*) /$1 break;
            proxy_pass http://auth_service;
        }

        # Subscription Service
        location /api/subscriptions/ {
            rewrite ^/api/subscriptions/(.*) /$1 break;
            proxy_pass http://subscription_service;
        }

        # Ingestion Service
        location /api/ingestion/ {
            rewrite ^/api/ingestion/(.*) /$1 break;
            proxy_pass http://ingestion_service;
        }

        # Analytics Service
        location /api/analytics/ {
            rewrite ^/api/analytics/(.*) /$1 break;
            proxy_pass http://analytics_service;
            
            # SSE specific headers
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
        }

        # Notification Service
        location /api/notifications/ {
            rewrite ^/api/notifications/(.*) /$1 break;
            proxy_pass http://notification_service;
        }

        # Admin Service
        location /api/admin/ {
            rewrite ^/api/admin/(.*) /$1 break;
            proxy_pass http://admin_service;
        }

        # ML API
        location /api/ml/ {
            rewrite ^/api/ml/(.*) /$1 break;
            proxy_pass http://ml_api;
        }
        
        # Frontend Application
        location / {
            proxy_pass http://frontend:80; # Nginx inside frontend container runs on 80.
        }
    }
}
