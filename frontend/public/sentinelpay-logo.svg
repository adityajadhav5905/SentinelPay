<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#logoGradient)" opacity="0.15"/>
  
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="28" stroke="url(#logoGradient)" stroke-width="2" fill="none" filter="url(#glow)"/>
  
  <!-- Anomaly detection wave pattern -->
  <path 
    d="M12 32 L18 32 L22 24 L26 40 L30 20 L34 44 L38 28 L42 36 L46 32 L52 32" 
    stroke="url(#logoGradient)" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />
  
  <!-- Center pulse dot -->
  <circle cx="32" cy="32" r="4" fill="url(#logoGradient)" filter="url(#glow)"/>
</svg>
